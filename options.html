<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THU Auto Login – Options</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 20px;
        }

        form {
            max-width: 480px;
        }

        label {
            display: block;
            margin: 10px 0 4px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
        }

        .row {
            margin-top: 10px;
        }

        .actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
    </style>
</head>

<body>
    <h1>THU Auto Login – Options</h1>
    <form id="form">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" />


        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />


        <div class="row">
            <label><input id="autoSubmit" type="checkbox" checked /> Auto submit after fill</label>
        </div>


        <div class="actions">
            <button type="submit">Save</button>
            <button id="clear" type="button">Clear</button>
        </div>
    </form>
    <script src="options.js"></script>
</body>

</html>
